<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="445" viewBox="0 0 1000 445" role="img" aria-labelledby="title desc">
  <title id="title">SHARiFULx GitHub profile</title>
  <desc id="desc">ASCII portrait of SHARiFUL iSLAM beside terminal-style public GitHub profile information.</desc>
  <style>
    .canvas { fill: #f6f8fa; }
    .panel { fill: #ffffff; stroke: #d0d7de; }
    .divider { stroke: #d8dee4; }
    .portrait { fill: #0969da; font: 11.3px/1 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .terminal { fill: #24292f; font: 12px/1 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #1a7f37; font-weight: 700; }
    .command { fill: #8250df; }
    .key { fill: #0969da; }
    .value { fill: #24292f; }
    .muted { fill: #6e7781; }
    .caption { fill: #57606a; font: 12px/1 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; letter-spacing: .08em; }
    text, tspan { white-space: pre; }
  </style>

